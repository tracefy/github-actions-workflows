name: python-test-uv

on:
  workflow_call:
    inputs:
      require_typecheck:
        type: boolean
        default: false
      test_coverage_configured_internally:
        type: boolean
        default: false
      extra_packages:
        type: string
        default: ""
        description: "space seprated list of packages to install"
      aws-role-oid:
        type: string
        description: "the web identity role used to authenticate to aws"
        required: false
        default: "arn:aws:iam::225989361606:role/oidc-github-terraform"
      aws-role-codeartifact:
        type: string
        description: "the role assumed after authenticating to generate the codeartifact authorization token"
        required: false
        default: "arn:aws:iam::288761731503:role/github/code-artifact"
      codeartifact-domain:
        type: string
        description: "https://<domain>-<domain-owner>.d.codeartifact.<region>.amazonaws.com/"
        required: false
        default: "https://tracefy-288761731503.d.codeartifact.eu-central-1.amazonaws.com/"

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: self-hosted
    strategy:
      # run every check even when one fails, so a PR reports all failures at once
      fail-fast: false
      matrix:
        # the three static checks share one leg (cheap, one setup); pytest runs in parallel
        check: [static, pytest]
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: generate codeartifact token
        id: codeartifact-token
        if: ${{ inputs.codeartifact-domain != ''  && inputs.aws-role-codeartifact != '' }}
        uses: tracefy/github-actions-workflows/.github/actions/aws-codeartifact-token@v2
        with:
          codeartifact-domain: ${{ inputs.codeartifact-domain }}
          aws-role-oid: ${{ inputs.aws-role-oid }}
          aws-role-codeartifact: ${{ inputs.aws-role-codeartifact }}

      - name: set credentials for private repository
        run: |
          echo "UV_INDEX_PRIVATE_REGISTRY_USERNAME=aws" >> $GITHUB_ENV
          echo "UV_INDEX_PRIVATE_REGISTRY_PASSWORD=${{ steps.codeartifact-token.outputs.AWS_CODEARTIFACT_TOKEN }}" >> $GITHUB_ENV

      - name: assert uv.lock is present
        shell: bash
        run: |
          # require uv.lock to be present in the repository
          [ -f uv.lock ] || (echo "uv.lock missing" 1>&2 && exit 1)

      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: set up python
        run: uv python install

      - name: install extra packages
        if: ${{ inputs.extra_packages != '' }}
        shell: bash
        run: apt-get -y install ${{ inputs.extra_packages }}

      - name: install dependencies
        run: uv sync --all-extras --dev --all-packages

      - name: install shared test/lint tooling
        # installs into the synced venv without touching pyproject.toml / uv.lock,
        # so repos that don't declare these dev deps still work
        run: uv pip install pytest pytest-cov coverage ruff basedpyright

      - name: format check
        if: ${{ matrix.check == 'static' }}
        id: format
        continue-on-error: true
        run: uv run ruff format --check

      - name: lint
        if: ${{ matrix.check == 'static' }}
        id: lint
        continue-on-error: true
        run: uv run ruff check

      - name: typecheck
        if: ${{ matrix.check == 'static' }}
        id: typecheck
        continue-on-error: true
        run: uv run basedpyright

      # run all three static checks, then fail once if any of them did
      - name: report static results
        if: ${{ matrix.check == 'static' }}
        shell: bash
        run: |
          echo "format check: ${{ steps.format.outcome }}"
          echo "lint:         ${{ steps.lint.outcome }}"
          echo "typecheck:    ${{ steps.typecheck.outcome }} (required: ${{ inputs.require_typecheck }})"

          fail=0
          if [[ "${{ steps.format.outcome }}" == "failure" ]]; then echo "::error::format check failed"; fail=1; fi
          if [[ "${{ steps.lint.outcome }}" == "failure" ]]; then echo "::error::lint failed"; fail=1; fi
          if [[ "${{ inputs.require_typecheck }}" == "true" && "${{ steps.typecheck.outcome }}" == "failure" ]]; then
            echo "::error::typecheck failed"; fail=1
          fi
          exit $fail

      # https://docs.pytest.org/en/stable/reference/exit-codes.html
      - name: test
        if: ${{ matrix.check == 'pytest' }}
        shell: bash
        run: |
          if [[ "${{ inputs.test_coverage_configured_internally }}" == "true" ]]; then
            COV_OPTION="--cov"
          else
            COV_OPTION="--cov=src"
          fi

          uv run pytest $COV_OPTION --cov-report= --cov-branch || {
            exit_code=$?
            # allow exit code 0 (all pass) and 5 (no tests found)
            if [[ $exit_code -ne 0 && $exit_code -ne 5 ]]
            then
              exit $exit_code
            fi
            if [[ $exit_code -eq 5 ]]
            then
              rm .coverage
            fi
          }

      - name: coverage
        if: ${{ matrix.check == 'pytest' }}
        shell: bash
        run: |
          if [[ -f .coverage ]]
          then
            uv run coverage report
          fi
